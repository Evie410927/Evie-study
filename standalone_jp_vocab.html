<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>卡欧每天学JP💪</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="卡欧每天学JP💪">
  <style>
/* ==========================================================================
   随身日语单词本 - iOS Mobile Design System
   ========================================================================== */

:root {
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  
  --bg-primary: #0f172a;
  --bg-secondary: #1e293b;
  --bg-card: rgba(30, 41, 59, 0.75);
  --bg-card-solid: #1e293b;
  --bg-input: #334155;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  --accent-primary: #0ea5e9; /* Japanese Indigo-Sky Blue accent */
  --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
  --accent-success: #10b981;
  --accent-warning: #f59e0b;
  --accent-danger: #ef4444;
  --accent-info: #3b82f6;
  
  --border-color: rgba(255, 255, 255, 0.08);
  --border-highlight: rgba(255, 255, 255, 0.15);
  
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.4);
  --glass-blur: blur(16px);
  
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;
  
  --safe-top: env(safe-area-inset-top, 20px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

body.light-theme {
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-card-solid: #ffffff;
  --bg-input: #e2e8f0;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  
  --border-color: rgba(0, 0, 0, 0.06);
  --border-highlight: rgba(0, 0, 0, 0.12);
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: var(--font-family);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  background-color: var(--bg-primary);
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.3);
}

/* Header Navbar */
.app-header {
  padding: calc(var(--safe-top) + 12px) 20px 14px;
  background: var(--bg-card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  flex-shrink: 0;
}

.app-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.app-title .icon {
  font-size: 24px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.icon-btn:active {
  transform: scale(0.92);
  background: rgba(255, 255, 255, 0.15);
}

.main-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  padding-bottom: calc(var(--safe-bottom) + 85px);
  position: relative;
}

.tab-view {
  display: none;
  animation: fadeIn 0.25s ease-out forwards;
}

.tab-view.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-around;
  padding: 8px 12px calc(var(--safe-bottom) + 8px);
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  transition: all 0.2s ease;
  cursor: pointer;
  border: none;
  background: transparent;
}

.nav-item .nav-icon {
  font-size: 20px;
  transition: transform 0.2s ease;
}

.nav-item.active {
  color: var(--accent-primary);
  font-weight: 600;
}

.nav-item.active .nav-icon {
  transform: translateY(-2px);
}

.nav-item:active {
  transform: scale(0.92);
}

.search-box {
  position: relative;
  margin-bottom: 14px;
}

.search-input {
  width: 100%;
  padding: 12px 38px 12px 42px;
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--accent-primary);
}

.search-clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 50%;
  transition: all 0.2s;
  user-select: none;
}

.search-clear-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.15);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
}

.active-tags-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: -6px;
  margin-bottom: 12px;
}
.active-tag-chip {
  background: var(--accent-gradient);
  color: #ffffff;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  animation: fadeIn 0.2s ease-out;
}
.tag-remove-btn {
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  padding: 1px 4px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.25);
  transition: background 0.2s;
}
.tag-remove-btn:hover {
  background: rgba(0, 0, 0, 0.5);
}

.filter-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 12px;
  scrollbar-width: none;
}

.filter-pills::-webkit-scrollbar {
  display: none;
}

.pill-btn {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pill-btn.active {
  background: var(--accent-primary);
  color: #ffffff;
  border-color: var(--accent-primary);
  font-weight: 600;
}

.sub-filter-row {
  display: flex;
  align-items: center;
  margin-top: -4px;
  margin-bottom: 12px;
  transition: all 0.2s ease;
}

.sub-filter-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.sub-pill-btn {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-color);
  background: var(--bg-card-solid);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
}

.sub-pill-btn:hover {
  border-color: var(--accent-color);
  color: var(--text-primary);
}

.sub-pill-btn.active {
  background: rgba(99, 102, 241, 0.15);
  border-color: var(--accent-color);
  color: var(--accent-color);
  font-weight: 600;
}

.word-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.word-card {
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  position: relative;
  transition: transform 0.2s ease, border-color 0.2s ease;
  box-shadow: var(--shadow-sm);
}

.word-card:active {
  transform: scale(0.98);
}

.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 6px;
}

.word-title-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.word-text {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.word-reading {
  font-size: 14px;
  color: var(--accent-primary);
  font-weight: 500;
}

.mastered-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: rgba(16, 185, 129, 0.15);
  color: var(--accent-success);
  border: 1px solid rgba(16, 185, 129, 0.3);
  font-weight: 600;
}

.word-meaning {
  font-size: 15px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: 8px;
}

.word-example-box {
  background: rgba(0, 0, 0, 0.15);
  border-left: 3px solid var(--accent-primary);
  padding: 8px 12px;
  border-radius: 4px;
  margin-top: 8px;
  font-size: 13px;
}

.word-example {
  color: var(--text-primary);
  margin-bottom: 2px;
  line-height: 1.3;
}

.word-example-trans {
  color: var(--text-muted);
}

.word-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--border-color);
  font-size: 12px;
  color: var(--text-muted);
}

.word-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.tag-badge {
  background: rgba(255, 255, 255, 0.06);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--text-secondary);
  font-size: 11px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s ease;
}

.tag-badge:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-primary);
}

.tag-badge.custom-tag {
  background: rgba(99, 102, 241, 0.12);
  color: #a5b4fc;
  border: 1px solid rgba(99, 102, 241, 0.25);
}

.tag-badge.custom-tag:hover {
  background: rgba(99, 102, 241, 0.22);
}

.remove-tag-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  color: #f87171;
  font-size: 11px;
  font-style: normal;
  font-weight: bold;
  line-height: 1;
  margin-left: 2px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.remove-tag-x:hover {
  background: #ef4444;
  color: #ffffff;
  transform: scale(1.15);
}

.add-tag-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px dashed var(--border-color);
  color: var(--text-muted);
  border-radius: 4px;
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
  padding: 0;
  line-height: 1;
}

.add-tag-btn:hover {
  border-color: var(--accent-color);
  color: var(--accent-color);
  background: rgba(99, 102, 241, 0.1);
  transform: scale(1.1);
}

/* Tag Dropdown Menu */
.word-tags, .detail-tags {
  position: relative;
}

.tag-dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 1000;
  min-width: 140px;
  background: var(--bg-modal);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 6px;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 4px;
  animation: fadeInDown 0.15s ease-out;
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.tag-dropdown-header {
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tag-dropdown-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
}

.tag-dropdown-item:hover {
  background: var(--bg-card-hover);
  color: var(--accent-color);
}

.tag-dropdown-item.preset {
  font-weight: 500;
}

.tag-dropdown-divider {
  height: 1px;
  background: var(--border-color);
  margin: 2px 0;
}


/* Similar Words Section CSS */
.similar-words-container {
  transition: all 0.2s ease;
}
.similar-word-chip {
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: transform 0.15s ease, background-color 0.15s ease;
}
.similar-word-chip:active {
  transform: scale(0.98);
  background: var(--bg-input);
}
.similar-word-title {
  display: flex;
  align-items: center;
  gap: 6px;
}
.similar-word-text {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}
.similar-word-reading {
  font-size: 11px;
  color: var(--accent-info);
  font-weight: 500;
}
.similar-word-meaning {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.3;
}


.kr-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 10px;
  padding: 2px 8px;
  background: rgba(236, 72, 153, 0.15);
  color: #f472b6;
  border: 1px solid rgba(236, 72, 153, 0.3);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  vertical-align: middle;
}


@keyframes spin-sync {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.syncing-active {
  animation: spin-sync 1s linear infinite;
  color: var(--accent-primary) !important;
}

/* Detail Modal Sheet CSS */
.detail-sheet {
  max-height: 85vh;
  display: flex;
  flex-direction: column;
}

.detail-title-group {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.detail-word {
  font-size: 24px;
  font-weight: 800;
  color: var(--text-primary);
  margin: 0;
}

.detail-reading {
  font-size: 15px;
  color: var(--accent-primary);
  font-weight: 600;
}

.detail-body {
  overflow-y: auto;
  padding: 10px 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.detail-meaning {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  background: var(--bg-card-hover);
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border-left: 4px solid var(--accent-color);
}

.detail-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.detail-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}

.detail-examples-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-example-item {
  background: rgba(0, 0, 0, 0.18);
  border: 1px solid var(--border-color);
  border-left: 3px solid var(--accent-primary);
  border-radius: var(--radius-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.detail-example-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-color);
  background: rgba(99, 102, 241, 0.12);
  padding: 2px 6px;
  border-radius: 4px;
  width: fit-content;
  margin-bottom: 2px;
}

.detail-example-text {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 600;
  line-height: 1.4;
}

.detail-example-trans {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.3;
}

.detail-notes-box {
  font-size: 13px;
  color: var(--text-muted);
  background: rgba(255, 255, 255, 0.03);
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--border-color);
}

.detail-footer {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--border-color);
}

.card-actions {
  display: flex;
  gap: 12px;
}

.action-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
  transition: color 0.2s;
}

.action-btn:hover, .action-btn:active {
  color: var(--text-primary);
}

.speak-btn {
  color: var(--accent-info);
}

.flashcard-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

.review-progress-bar {
  width: 100%;
  background: var(--bg-card-solid);
  height: 8px;
  border-radius: var(--radius-full);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-color);
}

.review-progress-fill {
  height: 100%;
  background: var(--accent-gradient);
  width: 0%;
  transition: width 0.3s ease;
}

.review-status-text {
  font-size: 13px;
  color: var(--text-muted);
  text-align: center;
}

.scene {
  width: 100%;
  height: 360px;
  perspective: 1000px;
  cursor: pointer;
}

.flashcard {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
  transform-style: preserve-3d;
}

.flashcard.is-flipped {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius-lg);
  background: var(--bg-card-solid);
  border: 1px solid var(--border-highlight);
  box-shadow: var(--shadow-lg);
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.card-face-front {
  background: linear-gradient(145deg, var(--bg-card-solid) 0%, rgba(30, 41, 59, 0.9) 100%);
}

.card-face-back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, rgba(30, 41, 59, 0.95) 0%, var(--bg-card-solid) 100%);
  overflow-y: auto;
}

.card-hint {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}

.card-main-word {
  font-size: 32px;
  font-weight: 800;
  color: var(--text-primary);
  margin-top: auto;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}

.card-reading-text {
  font-size: 18px;
  color: var(--accent-primary);
  font-weight: 600;
  margin-bottom: auto;
}

.card-meaning-text {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
  margin-top: 10px;
  margin-bottom: 12px;
}

.card-example-block {
  width: 100%;
  text-align: left;
  background: rgba(0, 0, 0, 0.2);
  padding: 12px;

  <script>
class JpVocabApp {
  
  // ==========================================================================
  // Cloud Realtime Sync Engine (JSONBlob REST API Integration)
  // ==========================================================================
  get CLOUD_BLOB_ID() {
    return '019fd11f-c603-7033-b9dd-807e1554c295';
  }

  async syncToCloud(showToastNotification = false) {
    try {
      const syncBtn = document.getElementById('cloudSyncBtn');
      if (syncBtn) syncBtn.classList.add('syncing-active');

      const url = `https://jsonblob.com/api/jsonBlob/${this.CLOUD_BLOB_ID}`;
      const payload = JSON.stringify({
        updatedAt: Date.now(),
        words: this.words
      });

      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: payload
      });

      if (syncBtn) syncBtn.classList.remove('syncing-active');

      if (response.ok) {
        if (showToastNotification) {
          this.showToast('☁️ 已成功同步最新数据到云端！');
        }
        return true;
      }
    } catch (err) {
      console.warn('Cloud sync error:', err);
      const syncBtn = document.getElementById('cloudSyncBtn');
      if (syncBtn) syncBtn.classList.remove('syncing-active');
    }
    return false;
  }

  async fetchFromCloud(showToastNotification = true) {
    const syncBtn = document.getElementById('cloudSyncBtn');
    if (syncBtn) syncBtn.classList.add('syncing-active');

    if (showToastNotification) {
      this.showToast('☁️ 正在连接云端同步最新词库...');
    }

    try {
      const url = `https://jsonblob.com/api/jsonBlob/${this.CLOUD_BLOB_ID}`;
      
      // Use controller timeout to prevent iOS fetch hanging
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      const response = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (response.ok) {
        const cloudData = await response.json();
        if (cloudData && Array.isArray(cloudData.words) && cloudData.words.length > 0) {
          this.words = cloudData.words;
          try {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.words));
          } catch(e) {}
          this.renderWordList();
          this.updateStats();
          if (showToastNotification) {
            this.showToast(`🎉 成功同步云端最新数据 (${this.words.length} 个词)！`);
          }
          return true;
        }
      }
      if (showToastNotification) {
        this.showToast('☁️ 当前已是最新词库数据！');
      }
    } catch (err) {
      console.warn('iOS Sandbox / Fetch error:', err);
      if (showToastNotification) {
        this.showToast('☁️ 已展示本地词库，联网后可点击☁️同步');
      }
    } finally {
      if (syncBtn) {
        setTimeout(() => syncBtn.classList.remove('syncing-active'), 500);
      }
    }
    return false;
  }

  constructor() {
    this.STORAGE_KEY = 'evie_jp_vocab_data_v5000';
    this.THEME_KEY = 'evie_jp_vocab_theme';
    this.words = [];
    this.reviewList = [];
    this.currentReviewIndex = 0;
    this.currentFilter = 'learning';
    this.subFilter = 'all';
    this.searchQuery = '';
    this.selectedTags = new Set();
    this.currentPage = 1;
    this.pageSize = 20;
    this.init();
  }

  init() {
    try {
      // Auto purge old obsolete storage keys safely
      Object.keys(localStorage).forEach(k => {
        if (k.startsWith('evie_') && k !== this.STORAGE_KEY) {
          localStorage.removeItem(k);
        }
      });
    } catch (e) {
      console.warn('LocalStorage access check:', e);
    }

    // Always load local default samples first to prevent 0 words UI freeze
    this.loadData();
    this.renderWordList();
    this.updateStats();

    // Async background sync without blocking UI initialization
    setTimeout(() => {
      this.fetchFromCloud(false).catch(err => console.warn('Background sync silent warning:', err));
    }, 300);
  }

  loadData() {
    try {
      const stored = localStorage.getItem(this.STORAGE_KEY);
      this.words = stored ? JSON.parse(stored) : [];
      if (this.words.length === 0) {
        this.loadSampleData(false);
      }
    } catch (e) {
      this.words = [];
      this.loadSampleData(false);
    }
  }

  saveData() {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.words));
    this.syncToCloud(false);
      this.updateStats();
    } catch (e) {
      this.showToast('⚠️ 保存失败');
    }
  }

  loadTheme() {
    const savedTheme = localStorage.getItem(this.THEME_KEY);
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
      document.getElementById('themeToggleBtn').textContent = '☀️';
    } else {
      document.body.classList.remove('light-theme');
      document.getElementById('themeToggleBtn').textContent = '🌙';
    }

  openWordModal(word = null) {

  renderModalTags() {
    const container = document.getElementById('modalTagsContainer');
    if (!container) return;

    const systemPOSList = ['动词', '形容词', '名词', '副词', '短语', '惯用句', '接续词', '连体词', '形容动词', '感叹词', '代词', '数词', '语法', '句型', '词汇', '助词', '助动词', '俗语', '成语'];

    const tagsHtml = (this.editingModalTags || []).map(t => {
      const isSystem = systemPOSList.includes(t.trim());

      } else {
        return `<span class="tag-badge custom-tag">#${this.escapeHtml(t)}<i class="remove-tag-x" onclick="event.stopPropagation(); app.removeModalTag('${this.escapeHtml(t)}')" title="删除标签">×</i></span>`;
      }

    container.innerHTML = tagsHtml + `<button type="button" class="add-tag-btn" onclick="app.showModalTagDropdown(event)" title="添加标签">+</button>`;

  showModalTagDropdown(event) {
    event.stopPropagation();
    this.closeTagDropdown();

    const btn = event.currentTarget;
    const parentTagsDiv = btn.closest('#modalTagsContainer');
    if (!parentTagsDiv) return;

    const menu = document.createElement('div');
    menu.className = 'tag-dropdown-menu';
    menu.id = 'activeTagDropdown';
    menu.innerHTML = `
      <div class="tag-dropdown-header">快捷标签</div>
      <button type="button" class="tag-dropdown-item preset" onclick="app.addTagToModal('易忘')">📌 #易忘</button>
      <button type="button" class="tag-dropdown-item preset" onclick="app.addTagToModal('易混')">🔀 #易混</button>

  addTagToModal(tagType) {
    this.closeTagDropdown();
    if (!this.editingModalTags) this.editingModalTags = [];

    let targetTag = tagType;
    if (tagType === 'custom') {
      const newTag = prompt("请输入要添加的自定义标签：");
      if (!newTag) return;
      targetTag = newTag.trim();
    }

    if (!targetTag) return;
    if (this.editingModalTags.includes(targetTag)) return;

    this.editingModalTags.push(targetTag);
    this.renderModalTags();
  }

  removeModalTag(tagName) {
    if (!this.editingModalTags) return;
    this.editingModalTags = this.editingModalTags.filter(t => t !== tagName);
    this.renderModalTags();
  }

  getParsedExamples(w) {
    if (!w) return [];
    if (Array.isArray(w.examples) && w.examples.length > 0) {
      return w.examples;
    }
    if (!w.example) return [];

    const exLines = w.example.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const trLines = (w.exampleTrans || '').split(/\n+/).map(s => s.trim()).filter(Boolean);

    return exLines.map((ex, idx) => ({
      example: ex,
      trans: trLines[idx] || ''
    }));
  }

  
  getSimilarWords(targetWord, limit = 3) {
    if (!targetWord || !this.words || this.words.length <= 1) return [];

    const targetMeaningClean = targetWord.meaning.replace(/^(v|n|adj|adv|短语|惯用句|句型|语法|短語|慣用句)\.\s*/i, '');
    const keywords = targetMeaningClean.split(/[,，；;\s/]/).map(k => k.trim()).filter(k => k.length >= 1);
    const targetTags = new Set((targetWord.tags || []).map(t => t.toLowerCase()));

    const scoredWords = [];

    this.words.forEach(w => {
      if (w.id === targetWord.id || w.word === targetWord.word) return;

      let score = 0;
      const wMeaningClean = w.meaning.replace(/^(v|n|adj|adv|短语|惯用句|句型|语法|短語|慣用句)\.\s*/i, '');

      keywords.forEach(kw => {
        if (kw && wMeaningClean.includes(kw)) {
          score += 5;
        }
      });

      if (w.tags && w.tags.length > 0) {
        w.tags.forEach(t => {
          if (targetTags.has(t.toLowerCase())) {
            score += 2;
          }
        });
      }

      if (score > 0) {
        scoredWords.push({ word: w, score });
      }
    });

    scoredWords.sort((a, b) => b.score - a.score);
    return scoredWords.slice(0, limit).map(item => item.word);
  }

  renderSimilarBlockHtml(similarWords) {
    if (!similarWords || similarWords.length === 0) return '';

    const itemsHtml = similarWords.map(w => `
      <div class="similar-word-chip" onclick="app.showDetailModal('${w.id}')" style="cursor:pointer;" title="点击查看此相近表达详情">
        <div class="similar-word-title">
          <span class="similar-word-text">${this.escapeHtml(w.word)}</span>
          ${w.reading ? `<span class="similar-word-reading">[${this.escapeHtml(w.reading.replace(/^[\[\(]+/, '').replace(/[\]\)]+$/, ''))}]</span>` : ''}
        </div>
        <div class="similar-word-meaning">${this.escapeHtml(w.meaning)}</div>
      </div>
    `).join('');

    return `
      <div class="similar-words-container" style="margin-top:12px; padding:12px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid var(--border-color);">
        <div style="font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; display:flex; align-items:center; gap:4px;">
          <span>🔗 相近表达/近义推荐</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${itemsHtml}
        </div>
      </div>
    `;
  }

    this.currentDetailWordId = wordId;

    document.getElementById('detailWord').textContent = word.word;
    document.getElementById('detailReading').textContent = word.reading || '';

    const tagsHtml = (word.tags || []).map(t => {
      const isSystem = systemPOSList.includes(t.trim());

      }
    }).join('');
    tagsContainer.innerHTML = tagsHtml + `<button class="add-tag-btn" onclick="app.showTagDropdown(event, '${word.id}')" title="添加自定义标签">+</button>`;

    const parsedExamples = this.getParsedExamples(word);

        </div>
      `).join('');
    } else {
      listContainer.innerHTML = '<div style="font-size:13px; color:var(--text-muted);">暂无例句</div>';

  closeDetailModal() {
    document.getElementById('detailModal')?.classList.remove('active');
  }

  saveWordFromForm() {
    const id = document.getElementById('wordId').value;
    const wordText = document.getElementById('inputWord').value.trim();
    const reading = document.getElementById('inputReading').value.trim();
    const meaning = document.getElementById('inputMeaning').value.trim();
    const example = document.getElementById('inputExample').value.trim();
    const exampleTrans = document.getElementById('inputExampleTrans').value.trim();

    if (!wordText || !meaning) {
      this.showToast('请填写日语单词与释义');
      return;
    }

    const tags = this.editingModalTags ? [...this.editingModalTags] : [];

    if (id) {
      const index = this.words.findIndex(w => w.id === id);
      if (index !== -1) {
        this.words[index] = {
          ...this.words[index],
          word: wordText,
          reading,
          meaning,
          example,
          exampleTrans,
          tags,
          updatedAt: Date.now()
        };
        this.showToast('✅ 修改保存成功');
      }
    } else {
      const newWord = {
        id: 'jp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        word: wordText,
        reading,
        meaning,
        example,
        exampleTrans,
        tags,
        mastered: false,
        reviewCount: 0,
        createdAt: Date.now()
      };
      this.words.unshift(newWord);
      this.showToast('🎉 新日语单词已添加');
    }

    this.saveData();
    this.renderWordList();
    this.closeWordModal();
  }

  toggleMastered(id) {
    const word = this.words.find(w => w.id === id);
    if (word) {
      word.mastered = !word.mastered;
      this.saveData();
      this.renderWordList();
      this.showToast(word.mastered ? '🌟 已标记为掌握' : '📖 标记为学习中');
    }
  }

  deleteWord(id) {
    if (confirm('确定要删除这个日语单词吗？')) {
      this.words = this.words.filter(w => w.id !== id);
      this.saveData();
      this.renderWordList();
      this.showToast('🗑️ 已删除');
    }
  }

  getSearchFilteredWords() {
    return this.words.filter(w => {
      // Multi-tag combinations filter
      if (this.selectedTags && this.selectedTags.size > 0) {
        const wordTags = w.tags || [];
        const matchesAllSelectedTags = Array.from(this.selectedTags).every(st => 
          wordTags.some(wt => wt.toLowerCase() === st.toLowerCase())
        );
        if (!matchesAllSelectedTags) return false;
      }

      // Keyword search query
      if (this.searchQuery) {
        const q = this.searchQuery;
        const matchWord = w.word.toLowerCase().includes(q);
        const matchReading = w.reading && w.reading.toLowerCase().includes(q);
        const matchMeaning = w.meaning.toLowerCase().includes(q);
        const matchExample = w.example && w.example.toLowerCase().includes(q);
        const matchTags = w.tags && w.tags.some(t => t.toLowerCase().includes(q));
        return matchWord || matchReading || matchMeaning || matchExample || matchTags;
      }
      return true;
    });
  }

  renderWordList() {
    this.renderActiveTags();
    this.updateStats();
    const listContainer = document.getElementById('wordList');
    const searchFiltered = this.getSearchFilteredWords();
    let filtered = searchFiltered.filter(w => {
      if (this.currentFilter === 'learning') {
        if (w.mastered) return false;
        if (this.subFilter === 'easy-forget') {
          return (w.tags || []).includes('易忘');
        }
        if (this.subFilter === 'easy-confuse') {
          return (w.tags || []).includes('易混');
        }
        return true;
      }
      if (this.currentFilter === 'mastered' && !w.mastered) return false;
      return true;
    });

    const totalItems = filtered.length;
    const totalPages = Math.ceil(totalItems / this.pageSize) || 1;

    if (this.currentPage > totalPages) {
      this.currentPage = totalPages;
    }
    if (this.currentPage < 1) {
      this.currentPage = 1;
    }

    if (totalItems === 0) {
      listContainer.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🇯🇵</div>
          <h3>暂无日语单词</h3>
          <p>点击“新增日词”开始添加你正在学习的日语词汇吧！</p>
        </div>
      `;
      this.renderPaginationControls(0, 0);
      return;
    }

    const startIndex = (this.currentPage - 1) * this.pageSize;
    const pageItems = filtered.slice(startIndex, startIndex + this.pageSize);

    listContainer.innerHTML = pageItems.map(w => {
      const parsedExamples = this.getParsedExamples(w);
      const firstEx = parsedExamples[0];
      const exampleHtml = firstEx ? `
        <div class="word-example-box">
          <div class="word-example">${this.escapeHtml(firstEx.example)}</div>
          ${firstEx.trans ? `<div class="word-example-trans">${this.escapeHtml(firstEx.trans)}</div>` : ''}
        </div>
      ` : '';

      return `
        <div class="word-card" data-id="${w.id}" onclick="app.showDetailModal('${w.id}')" style="cursor:pointer;" title="点击查看详情与全量例句">
          <div class="word-header">
            <div class="word-title-group">
              <span class="word-text">${this.escapeHtml(w.word)}</span>
              ${w.reading ? `<span class="word-reading">${this.escapeHtml(w.reading)}</span>` : ''}
            </div>
            ${w.mastered ? `<span class="mastered-badge">已掌握</span>` : ''}
          </div>

          <div class="word-meaning">${this.escapeHtml(w.meaning)}${w.krMeaning ? `<span class="kr-badge">${this.escapeHtml(w.krMeaning)}</span>` : ''}</div>

          ${exampleHtml}

          <div class="word-footer" onclick="event.stopPropagation()">
            <div class="word-tags">
              ${(w.tags || []).map(t => {
                const systemPOSList = ['动词', '形容词', '名词', '副词', '短语', '惯用句', '接续词', '连体词', '形容动词', '感叹词', '代词', '数词', '语法', '句型', '词汇', '助词', '助动词', '俗语', '成语'];
                const isSystem = systemPOSList.includes(t.trim());
                if (isSystem) {
                  return `<span class="tag-badge pos-tag" onclick="event.stopPropagation(); app.filterByTag('${this.escapeHtml(t)}')" style="cursor:pointer;" title="点击按标签筛选">#${this.escapeHtml(t)}</span>`;
                } else {
                  return `<span class="tag-badge custom-tag" onclick="event.stopPropagation(); app.filterByTag('${this.escapeHtml(t)}')" style="cursor:pointer;" title="点击按标签筛选">#${this.escapeHtml(t)}<i class="remove-tag-x" onclick="event.stopPropagation(); app.removeCustomTag('${w.id}', '${this.escapeHtml(t)}')" title="删除自定义标签">×</i></span>`;
                }
              }).join('')}
              <button class="add-tag-btn" onclick="app.showTagDropdown(event, '${w.id}')" title="添加自定义标签">+</button>
            </div>
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="action-btn speak-btn" onclick="event.stopPropagation(); app.speakWord('${this.escapeHtml(w.word)}')" title="日语发音">🔊</button>
              <button class="action-btn" onclick="event.stopPropagation(); app.toggleMastered('${w.id}')" title="掌握状态">${w.mastered ? '🔄 学习中' : '✅ 掌握'}</button>
              <button class="action-btn" onclick="event.stopPropagation(); app.editWord('${w.id}')" title="编辑">✏️</button>
              <button class="action-btn" onclick="event.stopPropagation(); app.deleteWord('${w.id}')" title="删除">🗑️</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    this.renderPaginationControls(totalPages, totalItems);
  }

  showTagDropdown(event, wordId) {

    menu.innerHTML = `
      <div class="tag-dropdown-header">快捷标签</div>
      <button class="tag-dropdown-item preset" onclick="app.addTagFromDropdown(event, '${wordId}', '易忘')">📌 #易忘</button>
      <button class="tag-dropdown-item preset" onclick="app.addTagFromDropdown(event, '${wordId}', '易混')">🔀 #易混</button>
      <div class="tag-dropdown-divider"></div>
      <button class="tag-dropdown-item" onclick="app.addTagFromDropdown(event, '${wordId}', 'custom')">✏️ 自定义标签...</button>
    `;

    parentTagsDiv.appendChild(menu);

    setTimeout(() => {
      this.dropdownCloseHandler = (e) => {
        if (!menu.contains(e.target)) {
          this.closeTagDropdown();
        }
      };
      document.addEventListener('click', this.dropdownCloseHandler);
    }, 10);
  }

  closeTagDropdown() {
    const existing = document.getElementById('activeTagDropdown');
    if (existing) {
      const parentCard = existing.closest('.word-card');
      if (parentCard) {
        parentCard.style.zIndex = '';
      }
      existing.remove();
    }
    if (this.dropdownCloseHandler) {
      document.removeEventListener('click', this.dropdownCloseHandler);
      this.dropdownCloseHandler = null;
    }
  }

  addTagFromDropdown(event, wordId, tagType) {
    event.stopPropagation();
    this.closeTagDropdown();

    const word = this.words.find(w => w.id === wordId);
    if (!word) return;

    let targetTag = tagType;
    if (tagType === 'custom') {
      const newTag = prompt("请输入要添加的自定义标签：");
      if (!newTag) return;
      targetTag = newTag.trim();
    }

    if (!targetTag) return;

    if (!word.tags) {
      word.tags = [];
    }

    if (word.tags.includes(targetTag)) {
      return;
    }

    word.tags.push(targetTag);
    this.saveData();
    this.renderWordList();
    const detailModal = document.getElementById('detailModal');
    if (detailModal && detailModal.classList.contains('active')) {
      this.showDetailModal(wordId);
    }
  }

  removeCustomTag(wordId, tagName) {
    const word = this.words.find(w => w.id === wordId);
    if (!word || !word.tags) return;

    word.tags = word.tags.filter(t => t !== tagName);
    this.saveData();
    this.renderWordList();
    const detailModal = document.getElementById('detailModal');
    if (detailModal && detailModal.classList.contains('active')) {
      this.showDetailModal(wordId);
    }
  }

  renderPaginationControls(totalPages, totalItems) {
    const paginationBar = document.getElementById('paginationBar');
    if (!paginationBar) return;

    if (totalPages <= 1) {
      paginationBar.style.display = 'none';
      return;
    }

    let optionsHtml = '';
    for (let i = 1; i <= totalPages; i++) {
      optionsHtml += `<option value="${i}" ${i === this.currentPage ? 'selected' : ''}>第 ${i} 页</option>`;
    }

    paginationBar.style.display = 'flex';
    paginationBar.innerHTML = `
      <button class="page-btn" id="btnPrevPage" ${this.currentPage <= 1 ? 'disabled' : ''}>上一页</button>
      <div class="page-jump-container">
        <select id="pageJumpSelect" class="page-jump-select" title="点击滑动选择直接跳到指定页">
          ${optionsHtml}
        </select>
        <span class="page-info-total">/ ${totalPages} 页 (共 ${totalItems} 条)</span>
      </div>
      <button class="page-btn" id="btnNextPage" ${this.currentPage >= totalPages ? 'disabled' : ''}>下一页</button>
    `;

    document.getElementById('btnPrevPage')?.addEventListener('click', () => {
      if (this.currentPage > 1) {
        this.currentPage--;
        this.renderWordList();
        this.scrollToFirstCard();
      }
    });

    document.getElementById('btnNextPage')?.addEventListener('click', () => {
      if (this.currentPage < totalPages) {
        this.currentPage++;
        this.renderWordList();
        this.scrollToFirstCard();
      }
    });

    document.getElementById('pageJumpSelect')?.addEventListener('change', (e) => {
      const selectedPage = parseInt(e.target.value);
      if (selectedPage && selectedPage !== this.currentPage) {
        this.currentPage = selectedPage;
        this.renderWordList();
        this.scrollToFirstCard();
      }
    });
  }

  scrollToFirstCard() {
    const firstCard = document.querySelector('#wordList .word-card');
    if (firstCard) {
      const yOffset = -75;
      const y = firstCard.getBoundingClientRect().top + window.pageYOffset + yOffset;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  updateStats() {
    const searchFiltered = this.getSearchFilteredWords ? this.getSearchFilteredWords() : this.words;
    const all = searchFiltered.length;
    const mastered = searchFiltered.filter(w => w.mastered).length;
    const learningWords = searchFiltered.filter(w => !w.mastered);
    const learning = learningWords.length;

    const easyForgetCount = learningWords.filter(w => (w.tags || []).includes('易忘')).length;
    const easyConfuseCount = learningWords.filter(w => (w.tags || []).includes('易混')).length;

    document.getElementById('count-all').textContent = all;
    document.getElementById('count-learning').textContent = learning;
    document.getElementById('count-mastered').textContent = mastered;

    const countSubAll = document.getElementById('count-sub-all');
    if (countSubAll) countSubAll.textContent = learning;
    const countSubEF = document.getElementById('count-sub-easy-forget');
    if (countSubEF) countSubEF.textContent = easyForgetCount;
    const countSubEC = document.getElementById('count-sub-easy-confuse');
    if (countSubEC) countSubEC.textContent = easyConfuseCount;

    const subFilterRow = document.getElementById('subFilterRow');
    if (subFilterRow) {
      if (this.currentFilter === 'learning') {
        subFilterRow.style.display = 'flex';
      } else {
        subFilterRow.style.display = 'none';
      }
    }
  }

  clusterBySimilarity(items) {
    if (items.length <= 1) return items;
    const getSimilarity = (a, b) => {
      let score = 0;
      const tagsA = a.tags || [];
      const tagsB = b.tags || [];
      const commonTags = tagsA.filter(t => tagsB.includes(t));
      score += commonTags.length * 3;

      const mA = (a.meaning || '').replace(/[^\u4e00-\u9fa5]/g, '');
      const mB = (b.meaning || '').replace(/[^\u4e00-\u9fa5]/g, '');
      for (let i = 0; i < mA.length; i++) {
        if (mB.includes(mA[i])) score += 1;
      }
      return score;
    };

    const remaining = [...items];
    const result = [remaining.shift()];

    while (remaining.length > 0) {
      const last = result[result.length - 1];
      let bestIndex = 0;
      let bestScore = -1;

      for (let i = 0; i < remaining.length; i++) {
        const score = getSimilarity(last, remaining[i]);
        if (score > bestScore) {
          bestScore = score;
          bestIndex = i;
        }
      }
      result.push(remaining.splice(bestIndex, 1)[0]);
    }
    return result;
  }

  startReviewSession() {
    this.reviewList = this.words.filter(w => !w.mastered);
    if (this.reviewList.length === 0) {
      this.reviewList = [...this.words];
    }
    // 意思相近/表达相似聚类排序出词
    this.reviewList = this.clusterBySimilarity(this.reviewList);
    this.currentReviewIndex = 0;
    this.renderCurrentCard();
  }

  renderCurrentCard() {
    const flashcard = document.getElementById('flashcard');
    flashcard.classList.remove('is-flipped');

    if (this.reviewList.length === 0) {
      document.getElementById('cardFrontWord').textContent = '🎉 日语词库为空';
      document.getElementById('cardFrontReading').textContent = '点击新增开始添加单词吧';
      document.getElementById('reviewStatusText').textContent = '进度：0 / 0';
      document.getElementById('reviewProgressFill').style.width = '0%';
      return;
    }

    const word = this.reviewList[this.currentReviewIndex];
    if (!word) {
      document.getElementById('cardFrontWord').textContent = '✨ 日语卡片复习完成！';
      document.getElementById('cardFrontReading').textContent = '오늘도 수고하셨습니다!';
      document.getElementById('cardBackMeaning').textContent = '所有日语卡片已复习完毕';
      document.getElementById('cardBackExampleBlock').style.display = 'none';
      document.getElementById('cardBackNotes').style.display = 'none';
      document.getElementById('reviewStatusText').textContent = `进度：${this.reviewList.length} / ${this.reviewList.length}`;
      document.getElementById('reviewProgressFill').style.width = '100%';
      return;
    }

    const total = this.reviewList.length;
    const currentNum = this.currentReviewIndex + 1;
    document.getElementById('reviewStatusText').textContent = `进度：${currentNum} / ${total}`;
    document.getElementById('reviewProgressFill').style.width = `${(currentNum / total) * 100}%`;

    document.getElementById('cardFrontWord').textContent = word.word;
    document.getElementById('cardFrontReading').textContent = word.reading || '';

    document.getElementById('cardBackMeaning').innerHTML = this.escapeHtml(word.meaning) + (word.krMeaning ? `<span class="kr-badge" style="margin-left:12px;">${this.escapeHtml(word.krMeaning)}</span>` : '');
    const parsedExamples = this.getParsedExamples(word);
    const exBlock = document.getElementById('cardBackExampleBlock');
    if (parsedExamples.length > 0) {
      exBlock.style.display = 'block';
      exBlock.innerHTML = parsedExamples.map((exObj, idx) => `
        <div class="word-example-item" style="${idx > 0 ? 'margin-top:8px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.15);' : ''}">
          <div style="font-size:11px; color:var(--accent-color); font-weight:700; margin-bottom:2px;">例句 ${idx + 1}</div>
          <div class="word-example" style="font-size:14px; font-weight:600;">${this.escapeHtml(exObj.example)}</div>
          ${exObj.trans ? `<div class="word-example-trans" style="font-size:13px;">${this.escapeHtml(exObj.trans)}</div>` : ''}
        </div>
      `).join('');
    } else {
      exBlock.style.display = 'none';
    }

    const notesBlock = document.getElementById('cardBackNotes');
    if (word.notes) {
      notesBlock.style.display = 'block';
      notesBlock.textContent = '💡 笔记：' + word.notes;
    } else {
      notesBlock.style.display = 'none';
    }

    const cardBackSimilarBlock = document.getElementById('cardBackSimilarBlock');
    if (cardBackSimilarBlock) {
      const similarWords = this.getSimilarWords(word, 3);
      cardBackSimilarBlock.innerHTML = this.renderSimilarBlockHtml(similarWords);
    }
  }

  assessReview(type) {
    if (this.reviewList.length === 0 || this.currentReviewIndex >= this.reviewList.length) {
      this.startReviewSession();
      return;
    }

    const currentWord = this.reviewList[this.currentReviewIndex];
    if (!currentWord.tags) currentWord.tags = [];

    if (type === 'remembered') {
      currentWord.mastered = true;
      this.showToast('🌟 已标记为掌握');
    } else if (type === 'easy-forget') {
      currentWord.mastered = false;
      if (!currentWord.tags.includes('易忘')) {
        currentWord.tags.push('易忘');
      }
      this.showToast('📌 已自动打上 “#易忘” 标签');
    } else if (type === 'easy-confuse') {
      currentWord.mastered = false;
      if (!currentWord.tags.includes('易混')) {
        currentWord.tags.push('易混');
      }
      this.showToast('🔀 已自动打上 “#易混” 标签');
    }

    this.saveData();
    this.currentReviewIndex++;

    const flashcard = document.getElementById('flashcard');
    flashcard.classList.remove('is-flipped');
    setTimeout(() => {
      this.renderCurrentCard();
    }, 200);
  }

  speakWord(text) {
    if (!('speechSynthesis' in window)) {
      this.showToast('当前浏览器不支持语音');
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 0.88;
    window.speechSynthesis.speak(utterance);
  }

  exportHTML() {
    let fullHtml = document.documentElement.outerHTML;

    fullHtml = fullHtml.replace(/ class="modal-overlay active"/g, ' class="modal-overlay"');
    fullHtml = fullHtml.replace(/ class="is-flipped"/g, '');

    const startMarker = 'const ' + 'samples = [';
    const startIdx = fullHtml.indexOf(startMarker);
    if (startIdx !== -1) {
      let bracketCount = 0;
      let endIdx = -1;
      const arrayStart = startIdx + startMarker.length - 1;
      for (let i = arrayStart; i < fullHtml.length; i++) {
        if (fullHtml[i] === '[') bracketCount++;
        else if (fullHtml[i] === ']') {
          bracketCount--;
          if (bracketCount === 0) {
            endIdx = i + 1;
            break;
          }
        }
      }
      if (endIdx !== -1) {
        fullHtml = fullHtml.substring(0, arrayStart) + JSON.stringify(this.words, null, 2) + fullHtml.substring(endIdx);
      }
    }

    if (!fullHtml.toLowerCase().startsWith('<!doctype html>')) {
      fullHtml = '<!DOCTYPE html>\n' + fullHtml;
    }

    const filename = this.STORAGE_KEY.includes('kr') ? 'standalone_jp_vocab.html' : 'standalone_jp_vocab.html';
    const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    this.showToast('🚀 已成功导出最新全量 HTML 单词本！');
  }

  exportJSON() {
    if (this.words.length === 0) {
      this.showToast('词库为空');
      return;
    }
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.words, null, 2));
    const downloadAnchor = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `Japanese_Vocab_Backup_${dateStr}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    this.showToast('📦 导出日语备份 JSON 成功！');
  }

  importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          let count = 0;
          imported.forEach(item => {
            if (item.word && item.meaning) {
              if (!this.words.some(w => w.id === item.id || (w.word === item.word && w.meaning === item.meaning))) {
                this.words.unshift({
                  ...item,
                  id: item.id || ('jp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4))
                });
                count++;
              }
            }
          });
          this.saveData();
          this.renderWordList();
          this.showToast(`✅ 成功导入 ${count} 个日语单词！`);
        } else {
          this.showToast('⚠️ JSON 格式错误');
        }
      } catch (err) {
        this.showToast('⚠️ 文件读取失败');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }
