<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>卡欧随身双语单词本 Hub 🚀</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="卡欧双语单词本">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-kr: #ec4899;
      --accent-jp: #0ea5e9;
      --border-color: rgba(255, 255, 255, 0.1);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-primary);
      background-image: 
        radial-gradient(at 10% 20%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      user-select: none;
    }

    .hub-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .header-group {
      margin-bottom: 10px;
    }

    .hub-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .hub-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .app-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    .app-card.kr::before {
      background: var(--accent-kr);
    }

    .app-card.jp::before {
      background: var(--accent-jp);
    }

    .app-card:active {
      transform: scale(0.97);
      background: rgba(30, 41, 59, 0.9);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      font-size: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text-primary);
      transition: transform 0.2s ease;
    }

    .badge-cloud {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }

    .footer-tips {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      padding: 0 10px;
    }

    .pwa-tip {
      color: #cbd5e1;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <div class="header-group">
      <h1 class="hub-title">卡欧随身双语单词本 🚀</h1>
      <p class="hub-subtitle">云端实时同步 • 随身刷词体验</p>
    </div>

    <!-- KR Card -->
    <a href="standalone_kr_vocab.html" class="app-card kr">
      <div class="card-info">
        <div class="card-title-row">
          <span class="card-icon">🇰🇷</span>
          <span class="card-title">卡欧每天学KR💪</span>
        </div>
        <div class="card-desc">
          <span>687 个随身韩语词卡</span>
          <span class="badge-cloud">☁️ 云同步</span>
        </div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <!-- JP Card -->
    <a href="standalone_jp_vocab.html" class="app-card jp">
      <div class="card-info">
        <div class="card-title-row">
          <span class="card-icon">🇯🇵</span>
          <span class="card-title">卡欧每天学JP💪</span>
        </div>
        <div class="card-desc">
          <span>426 个随身日语词卡</span>
          <span class="badge-cloud">☁️ 云同步</span>
        </div>
      </div>
      <div class="card-arrow">➔</div>
    </a>

    <div class="footer-tips">
      💡 <span class="pwa-tip">添加到手机主屏幕使用方法</span>：<br>
      iPhone 在 Safari 中点击底部【分享】➔【添加到主屏幕】<br>
      Android 在 Chrome 中点击右上角【菜单】➔【添加到主屏幕】
    </div>
  </div>

</body>
</html>
